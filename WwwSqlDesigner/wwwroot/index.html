<html lang="en" xml:lang="en">

<head>
    <title>WWW SQL Designer</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" title="material-inspired" href="styles/material-inspired.css" media="all" />
    <link rel="alternate stylesheet" title="original" href="styles/original.css" media="all" />
    <link rel="stylesheet" href="styles/print.css" type="text/css" media="print" />
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/jszip-3.10.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/visual.js"></script>
    <script src="js/portabletypes.js"></script>
    <script src="js/row.js"></script>
    <script src="js/table.js"></script>
    <script src="js/relation.js"></script>
    <script src="js/key.js"></script>
    <script src="js/rubberband.js"></script>
    <script src="js/map.js"></script>
    <script src="js/maptools.js"></script>
    <script src="js/legend.js"></script>
    <script src="js/toggle.js"></script>
    <script src="js/io.js"></script>
    <script src="js/tablemanager.js"></script>
    <script src="js/rowmanager.js"></script>
    <script src="js/keymanager.js"></script>
    <script src="js/window.js"></script>
    <script src="js/options.js"></script>
    <script src="js/wwwsqldesigner.js"></script>
</head>

<body>
    <div id="area"></div>

    <div id="controls">
        <div id="bar">
            <div id="toggle"></div>
            <input type="button" id="saveload" />

            <hr />

            <input type="button" id="addtable" />
            <input type="button" id="edittable" />
            <input type="button" id="tablekeys" />
            <input type="button" id="removetable" />
            <input type="button" id="aligntables" />
            <input type="button" id="cleartables" />

            <hr />

            <input type="button" id="addrow" />
            <input type="button" id="editrow" />
            <input type="button" id="uprow" class="small" /><input type="button" id="downrow" class="small" />
            <input type="button" id="foreigncreate" />
            <input type="button" id="foreignconnect" />
            <input type="button" id="foreigndisconnect" />
            <input type="button" id="removerow" />

            <hr />

            <input type="button" id="options" />
        </div>

        <div id="rubberband"></div>

        <div id="maptools">
            <div id="minimap"></div>
            <details id="legendtools">
                <summary id="maptoggle" aria-label="Diagram details"></summary>
                <div id="maptoolcontent"></div>
            </details>
        </div>

        <div id="background"></div>

        <div id="window">
            <div id="windowpanel">
                <div id="windowtitle">
                    <img id="throbber" src="images/throbber.gif" alt="" title="" />
                </div>
                <div id="windowcontent"></div>
                <div id="windowbuttons">
                    <input type="button" id="windowok" />
                    <input type="button" id="windowcancel" />
                </div>
            </div>
        </div>
    </div>
    <!-- #controls -->

    <div id="optionspanel">
        <table aria-label="Options" role="presentation">
            <tbody>
                <tr>
                    <td>* <label id="language" for="optionlocale"></label></td>
                    <td>
                        <select id="optionlocale">
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label id="efnamespace" for="optionefnamespace">EF namespace</label></td>
                    <td><input type="text" size="32" id="optionefnamespace" /></td>
                </tr>
                <tr>
                    <td><label id="efcontext" for="optionefcontext">EF context name</label></td>
                    <td><input type="text" size="32" id="optionefcontext" /></td>
                </tr>
                <tr>
                    <td>
                        <label id="snap" for="optionsnap"></label>
                    </td>
                    <td>
                        <input type="text" size="4" id="optionsnap" />
                        <span class="small" id="optionsnapnotice"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="pattern" for="optionpattern"></label>
                    </td>
                    <td>
                        <input type="text" size="6" id="optionpattern" />
                        <span class="small" id="optionpatternnotice"></span>
                    </td>
                </tr>
                <tr>
                    <td>* <label id="style" for="optionstyle"></label></td>
                    <td>
                        <select id="optionstyle">
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="hide" for="optionhide"></label>
                    </td>
                    <td>
                        <input type="checkbox" id="optionhide" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="vector" for="optionvector"></label></td>
                    <td>
                        <input type="checkbox" id="optionvector" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="showsize" for="optionshowsize"></label></td>
                    <td>
                        <input type="checkbox" id="optionshowsize" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="showtype" for="optionshowtype"></label></td>
                    <td>
                        <input type="checkbox" id="optionshowtype" />
                    </td>
                </tr>
            </tbody>
        </table>

        <hr />

        * <span class="small" id="optionsnotice"></span>
    </div>

    <div id="loadsavepanel">
        <div class="io-columns">
            <div class="io-column">
            <fieldset id="iopanel">
            <div class="io-form-group">
                <div id="iosourcebuttons" class="io-form-row" role="group" aria-label="Storage source">
                    <button type="button" class="io-source-button" data-source="browser"></button>
                    <button type="button" class="io-source-button" data-source="xml"></button>
                    <button type="button" class="io-source-button" data-source="server"></button>
                </div>
            </div>
            <select id="iotype" aria-hidden="true" tabindex="-1">
                <option value="browser">Client</option>
                <option value="xml">File</option>
                <option value="server">Server</option>
            </select>
            <input type="hidden" id="backend" value="netcore-ef" />
            <div class="io-form-group" id="server-save-row">
                <div class="io-label-row">
                    <label for="serverloadname" id="servermodellabel"></label>
                </div>
                <div class="io-form-row">
                    <input type="text" id="serverloadname" autocomplete="off" />
                </div>
                <div class="io-form-row">
                    <input type="button" id="iosave" value="Save" />
                </div>
            </div>
            <div class="io-form-group" id="server-load-row">
                <div class="io-label-row">
                    <label for="serverloadmodel" id="serverloadmodellabel"></label>
                    <button type="button" id="serverlist"></button>
                </div>
                <div class="io-form-row">
                    <select id="serverloadmodel"><option value=""></option></select>
                </div>
                <div class="io-label-row">
                    <label for="serverowner" id="serverownerlabel"></label>
                </div>
                <div class="io-form-row">
                    <select id="serverowner"><option value=""></option></select>
                </div>
                <div class="io-label-row">
                    <label for="serverloadversion" id="serverversionlabel"></label>
                </div>
                <div class="io-form-row">
                    <select id="serverloadversion"><option value=""></option></select>
                </div>
                <div class="io-form-row">
                    <input type="button" id="ioload" value="Load" />
                </div>
            </div>
            </fieldset>
            </div>
            <div class="io-column">
            <fieldset id="ioshare">
                <div class="io-form-group">
                    <div class="io-label-row">
                        <label for="servergrantid" id="serveridlabel"></label>
                        <button type="button" id="servercopyid"></button>
                    </div>
                    <div class="io-form-row">
                        <input type="text" id="servergrantid" autocomplete="off" />
                    </div>
                    <div class="io-label-row">
                        <label for="servergrantgroup" id="servergrouplabel"></label>
                    </div>
                    <div class="io-form-row">
                        <select id="servergrantgroup"><option value=""></option></select>
                    </div>
                    <div class="io-form-row">
                        <input type="button" id="servershare" disabled />
                    </div>
                </div>
                <div class="io-form-group">
                    <div class="io-label-row">
                        <label for="serverknownuser">User</label>
                    </div>
                    <div class="io-form-row">
                        <select id="serverknownuser"><option value=""></option></select>
                    </div>
                    <div class="io-label-row">
                        <label for="serverknowngroup">Group</label>
                    </div>
                    <div class="io-form-row">
                        <select id="serverknowngroup"><option value=""></option></select>
                    </div>
                    <div class="io-form-row">
                        <input type="button" id="serverunshare" disabled />
                    </div>
                </div>
            </fieldset>
            </div>
            <div class="io-column">
                <div class="io-form-group">
                    <div class="io-label-row">
                        <label for="exporttarget" id="exporttargetlabel">Format</label>
                    </div>
                    <div class="io-form-row">
                        <select id="exporttarget"></select>
                    </div>
                    <div class="io-form-row">
                        <input type="button" id="clientsql" />
                    </div>
                    <div id="iostatus" role="status" aria-live="polite" hidden></div>
                </div>
                <div class="io-form-group">
                    <div class="io-label-row">
                        <label for="serverimportdatabase" id="serverimportdatabaselabel"></label>
                    </div>
                    <div class="io-form-row">
                        <input type="text" id="serverimportdatabase" />
                    </div>
                    <div class="io-form-row">
                        <input type="button" id="serverimport" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="keys">
        <fieldset>
            <legend id="keyslistlabel"></legend>
            <select id="keyslist">
                <option></option>
            </select>
            <input type="button" id="keyadd" />
            <input type="button" id="keyremove" />
        </fieldset>
        <fieldset>
            <legend id="keyedit"></legend>
            <table aria-label="Keylist" role="presentation">
                <tbody>
                    <tr>
                        <td>
                            <label for="keytype" id="keytypelabel"></label>
                            <select id="keytype">
                                <option></option>
                            </select>
                        </td>
                        <td></td>
                        <td>
                            <label for="keyname" id="keynamelabel"></label>
                            <input type="text" id="keyname" size="10" />
                        </td>
                    </tr>
                    <tr>
                        <td colspan="3">
                            <hr />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="keyfields" id="keyfieldslabel"></label><br />
                            <select id="keyfields" size="5" multiple="multiple">
                                <option></option>
                            </select>
                        </td>
                        <td>
                            <input type="button" id="keyleft" value="&lt;&lt;" /><br />
                            <input type="button" id="keyright" value="&gt;&gt;" /><br />
                        </td>
                        <td>
                            <label for="keyavail" id="keyavaillabel"></label><br />
                            <select id="keyavail" size="5" multiple="multiple">
                                <option></option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </fieldset>
    </div>

    <div id="table">
        <table aria-label="Tables" role="presentation">
            <tbody>
                <tr>
                    <td>
                        <label id="tablenamelabel" for="tablename"></label>
                    </td>
                    <td>
                        <input id="tablename" type="text" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="tableschemalabel" for="tableschema"></label>
                    </td>
                    <td>
                        <input id="tableschema" type="text" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="tablecommentlabel" for="tablecomment"></label>
                    </td>
                    <td>
                        <textarea rows="5" cols="40" id="tablecomment"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="tablerecordsschedulelabel" for="tablerecordsschedule"></label>
                    </td>
                    <td>
                        <textarea rows="5" cols="40" id="tablerecordsschedule"></textarea>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="text/javascript">
        const d = new SQL.Designer();
    </script>
</body>

</html>
